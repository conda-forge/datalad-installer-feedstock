{% set name = "datalad-installer" %}
{% set version = "1.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 583e131aca51ad5e63a337edf98801cca815575a56c8b3e319d9f7a7c9b97209

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - datalad-installer = datalad_installer:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - bash  # [not win]
    - git  # Needed for testing `datalad --help` after installation
    - pytest
    - pytest-cov
    - pytest-mock
    - python {{ python_min }}
  files:
    - test.bat
    - test.sh
  source_files:
    - test
    - tox.ini
  imports:
    - datalad_installer
  commands:
    - bash test.sh  # [not win]
    - test.bat  # [win]

about:
  home: https://github.com/datalad/datalad-installer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Installation script for Datalad and related components
  description: |
    `datalad-installer` is a script for installing Datalad, git-annex, and
    related components all in a single invocation.  It requires no third-party
    Python libraries, though it does make heavy use of external packaging
    commands.
  dev_url: https://github.com/datalad/datalad-installer

extra:
  recipe-maintainers:
    - yarikoptic
